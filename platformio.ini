; ============================================================
;  Heltec Vision Master T190
;  Board settings for the Heltec T190 (custom variant in variants/)
; ============================================================
[env:heltec_vision_master_t190]
platform  = espressif32@6.9.0   ; 1.1.1: 6.5.0 (Arduino 2.0.14) did not accept USB uploads
board     = heltec_vision_master_t190
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

board_build.variants_dir        = variants
board_build.variant             = heltec_t190
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.filesystem          = littlefs  ; enable the filesystem

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_T190
    -DARDUINO_heltec_vision_master_t190
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    arduino-libraries/NTPClient
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/lucadentella/TOTP-Arduino.git
; ============================================================
;  LilyGO T-Display S3 (since 1.3.0) - same code, board switch in include/BOARD.h
;  Flash: pio run -e tdisplays3 -t upload --upload-port COMxx
; ============================================================
[env:tdisplays3]
platform  = espressif32@6.9.0
board     = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_TDISPLAYS3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_ignore = HT_ST7789
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/lucadentella/TOTP-Arduino.git

; ============================================================
;  LilyGO T-Dongle S3 (since 1.4.0) - 160x80, one button, no battery, no PSRAM
;  Flash: pio run -e tdongles3 -t upload --upload-port COMxx
; ============================================================
[env:tdongles3]
platform  = espressif32@6.9.0
board     = t-dongle-s3
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_TDONGLES3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_ignore = HT_ST7789
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/lucadentella/TOTP-Arduino.git
